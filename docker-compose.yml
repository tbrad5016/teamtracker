services:
  db:
    image: postgres:16
    container_name: teamtracker_postgres
    environment:
      POSTGRES_USER: teamtracker
      # The password comes from the .env file next to this file (not hardcoded).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: teamtracker
    ports:
      # Reachable from this computer only. The left number must match DB_PORT in .env.
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # These run automatically, in this order, the first time the database is created.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

volumes:
  postgres_data:
